<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Room Code Only</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #1f2937;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .glass {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 1rem;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .btn {
      background-color: #6366f1;
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      font-weight: bold;
      margin-top: 1rem;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="glass">
    <h2 class="text-2xl font-bold mb-2">Room Code</h2>
    <div class="flex items-center justify-center gap-2">
      <span id="gameCodeDisplay" class="text-xl font-mono bg-gray-900 px-4 py-2 rounded-lg">------</span>
      <button id="copyCodeBtn" class="btn">Copy</button>
    </div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBq1gYmfPmBkNgzWtgI-iBzr0Lsq4oMxZU",
      authDomain: "app-store-87d8a.firebaseapp.com",
      projectId: "app-store-87d8a",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const gameCodeDisplay = document.getElementById("gameCodeDisplay");
    const copyCodeBtn = document.getElementById("copyCodeBtn");

    // Enter your desired room code to fetch
    const roomCode = prompt("Enter Room Code");

    async function loadRoomCode(code) {
      const q = query(collection(db, "artifacts/1:404049348425:web:2b11e8c35f4b1553c1fc98/public/data/ludoGames"), where("roomCode", "==", code));
      const snapshot = await getDocs(q);
      if (!snapshot.empty) {
        gameCodeDisplay.textContent = code;
      } else {
        gameCodeDisplay.textContent = "Not Found";
      }
    }

    copyCodeBtn.addEventListener("click", () => {
      const text = gameCodeDisplay.textContent;
      navigator.clipboard.writeText(text).then(() => {
        copyCodeBtn.textContent = "Copied!";
        setTimeout(() => (copyCodeBtn.textContent = "Copy"), 1000);
      });
    });

    loadRoomCode(roomCode);
  </script>
</body>
</html>
